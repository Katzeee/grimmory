name: Folio - Build and Publish Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git branch, tag, or commit to build
        required: true
        default: develop
        type: string
      image_tag:
        description: Mutable image tag for this build
        required: true
        default: folio
        type: string

jobs:
  build-and-push:
    name: Build and Push Folio Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Resolve Image Metadata
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          set -eu

          if ! printf '%s' "$REQUESTED_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "Invalid container image tag: $REQUESTED_TAG" >&2
            exit 1
          fi

          short_sha="$(git rev-parse --short=8 HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "APP_VERSION=${REQUESTED_TAG}-${short_sha}" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "IMMUTABLE_TAG=folio-${short_sha}" >> "$GITHUB_ENV"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.image_tag }}
            ${{ env.IMAGE }}:${{ env.IMMUTABLE_TAG }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            APP_REVISION=${{ env.COMMIT_SHA }}
          cache-from: type=gha,scope=folio-image
          cache-to: type=gha,scope=folio-image,mode=max
